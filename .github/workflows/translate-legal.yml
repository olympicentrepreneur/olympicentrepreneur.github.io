name: Translate legal pages (DeepL)

on:
  push:
    branches: [main]
    paths:
      - "assets/legal/*.html"
      - "scripts/translate_legal.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate even if the English source is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Translate with DeepL
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 scripts/translate_legal.py ${{ inputs.force && '--force' || '' }}
      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/legal/ro
          git diff --cached --quiet || git commit -m "Update Romanian legal translations (DeepL)"
          git push
